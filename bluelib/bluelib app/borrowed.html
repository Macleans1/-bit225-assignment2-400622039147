<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Borrowed Books - BlueLib</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="images/bluecrest-college-gh-logo-seal.webp" alt="BlueLib logo" class="logo" width="44" height="44">
      <span class="brand-text"><strong>BlueLib Catalogue</strong><small>BlueCrest College Library</small></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Browse</a></li>
        <li><a href="index.html#add">Add Book</a></li>
        <li><a href="borrowed.html" aria-current="page">My Borrowed Books <span id="borrow-count" class="count" hidden>0</span></a></li>

  <main>

  <footer class="site-footer">
    <p> Bright maclean, Student ID: 400622039147</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/borrowed.js"></script>
